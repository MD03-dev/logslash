[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logslash"
version = "0.1.0"
description = "CLI tool lọc và phân tích log hỗn hợp (JSON, syslog, plain text)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "logslash contributors"}]
keywords = ["log", "cli", "json", "syslog", "parser", "filter"]

[project.scripts]
logslash = "logslash.cli:main"

[tool.setuptools]
packages = ["logslash", "logslash.parsers", "logslash.filters", "logslash.outputs"]
